fees:
    title: Honoraires
    lead: Les honoraires de l’avocat sont libres ; ils sont convenus avec vous avant toute intervention, et vous savez à tout moment où ils en sont.
    agreement: La convention d’honoraires
    agreement_text: 'Sauf urgence, force majeure ou aide juridictionnelle totale, le cabinet conclut avec vous, par écrit, une convention d’honoraires : elle précise le montant ou le mode de calcul des honoraires pour les diligences prévisibles, ainsi que les frais et débours envisagés. Vous êtes ensuite informé régulièrement de leur évolution.'
    how: Comment ils sont fixés
    how_text: Les honoraires tiennent compte, selon les usages, de votre situation, de la difficulté de l’affaire, des frais exposés et des diligences accomplies.
    terms_missing: Le cabinet n’a pas encore indiqué ici ses modalités d’honoraires.
    no_quota_litis: 'Un honoraire de résultat peut compléter l’honoraire convenu ; il ne peut jamais constituer à lui seul toute la rémunération : le pacte de quota litis est interdit.'
    first: Premier rendez-vous
    legal_aid: Aide juridictionnelle
    payment: Règlement
    payment_text: 'Les honoraires se règlent par chèque, par virement ou par carte bancaire, sur présentation d’une note d’honoraires. Avant tout règlement définitif, un compte détaillé vous est remis.'
    pay_online: Régler une note d’honoraires
    pay_scope: Le paiement en ligne ne sert qu’au règlement des honoraires du cabinet. Les sommes destinées à un tiers ou à l’exécution d’une décision ne se versent jamais ici.
    dispute: En cas de désaccord
    dispute_text: Adressez-vous d’abord au cabinet. Si le différend persiste, les contestations d’honoraires relèvent du bâtonnier ; le client consommateur peut aussi saisir gratuitement le médiateur de la consommation de la profession d’avocat.
    dispute_link: Médiation

mediation:
    title: Médiation
    lead: En cas de différend avec le cabinet, une solution amiable peut être recherchée avec l’aide d’un tiers.
    first: D’abord, le cabinet
    first_text: Écrivez au cabinet pour exposer votre réclamation ; il vous répond.
    then: Ensuite, le médiateur de la consommation de la profession d’avocat
    then_text: Si la réponse ne vous satisfait pas, ou faute de réponse, le client consommateur peut saisir gratuitement le médiateur de la consommation de la profession d’avocat, institué par le Conseil national des barreaux.
    coordinates: Coordonnées du médiateur
    site: Site du médiateur
    bar: Le bâtonnier
    bar_text: 'Le cabinet est inscrit au {bar}. Les réclamations relatives aux honoraires peuvent être portées devant son bâtonnier.'

space:
    title: Espace client
    hello: Votre espace
    lead: Vos rendez-vous et vos pièces, à l’abri — les documents sont chiffrés et ne circulent jamais par courriel.
    next: Rendez-vous
    documents: Pièces et documents
    unread: '{count, plural, one {# nouveau} other {# nouveaux}}'
    all_documents: Tous les documents et dépôt
    ask: Demander un rendez-vous
    nav:
